<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyNewsHub | Continuous Live Feeds</title>
     <link rel="stylesheet" href="components/layout.css">
    <link rel="stylesheet" href="css/feeds.css">
   </head>
<body>
    
    <div id="header-container"></div>

    <main class="site-main">

        <section class="feeds-hero">
            <div class="hero-container">
                <h1 class="hero-title">Latest News</h1>
                <p class="hero-description">Your unfiltered, real-time chronicle of global events, breaking trends, and comprehensive analytical briefings.</p>
            </div>
        </section>

        <section class="controls-section">
            <div class="controls-container">
                
                <div class="search-wrapper">
                    <span class="search-icon-placeholder" aria-hidden="true">🔍</span>
                    <input type="text" id="news-search" placeholder="Search topics, headlines, or content..." aria-label="Search articles">
                    <button type="button" id="clear-search" class="clear-btn" aria-label="Clear search input" style="display: none;">✕</button>
                </div>

                <nav class="categories-filter" aria-label="Filter by Topic">
                    <div class="categories-filter-wrapper">
                        <button type="button" class="category-btn active" data-category="">All</button>
                        <button type="button" class="category-btn" data-category="technology">Technology</button>
                        <button type="button" class="category-btn" data-category="sports">Sports</button>
                        <button type="button" class="category-btn" data-category="business">Business</button>
                        <button type="button" class="category-btn" data-category="entertainment">Entertainment</button>
                        <button type="button" class="category-btn" data-category="science">Science</button>
                        <button type="button" class="category-btn" data-category="health">Health</button>
                    </div>
                </nav>

            </div>
        </section>

        <section class="feed-listing-section">
            <div class="feed-container">
                
                <div class="loading" id="feed-loading" style="display: none;"></div>
                <div class="error-message" id="feed-error" style="display: none;"></div>
                <div class="no-results" id="feed-no-results" style="display: none;">
                    <h2>No articles found.</h2>
                    <p>Try another keyword or select a different category.</p>
                </div>

                <div class="articles-container"></div>

                <div class="load-more-wrapper">
                    <button type="button" id="load-more" class="btn btn-load-more" style="display: none;">Load More</button>
                </div>

            </div>
        </section>

    </main>

    <div id="footer-container"></div>

    <script defer src="components/layout.js"></script>
    <script defer src="js/feeds.js"></script>
</body>
</html>
